<!DOCTYPE html>
<html>
<head>
    <title>Food Order Management</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 30px;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>🍔 Food Order Management System</h1>

<form id="orderForm">

    <input type="text" id="customer" placeholder="Customer Name" required>

    <input type="text" id="food" placeholder="Food Name" required>

    <input type="number" id="quantity" placeholder="Quantity" required>

    <input type="number" id="price" placeholder="Price" required>

    <select id="status">
        <option>Pending</option>
        <option>Preparing</option>
        <option>Delivered</option>
        <option>Cancelled</option>
    </select>

    <button type="submit">Add Order</button>

</form>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Food</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="orderList"></tbody>
</table>

<script>

const API = "http://127.0.0.1:8000/api/orders/";

let editId = null;

// CREATE
document.getElementById("orderForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {
        customer_name: document.getElementById("customer").value,
        food_name: document.getElementById("food").value,
        quantity: document.getElementById("quantity").value,
        price: document.getElementById("price").value,
        status: document.getElementById("status").value
    };

    if (editId) {

        await fetch(API + editId + "/", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        editId = null;

    } else {

        await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });
    }

    this.reset();
    loadOrders();
});

// READ
async function loadOrders() {

    const response = await fetch(API);
    const orders = await response.json();

    const list = document.getElementById("orderList");

    list.innerHTML = "";

    orders.forEach(order => {

        list.innerHTML += `
        <tr>
            <td>${order.id}</td>
            <td>${order.customer_name}</td>
            <td>${order.food_name}</td>
            <td>${order.quantity}</td>
            <td>₹${order.price}</td>
            <td>${order.status}</td>

            <td>
                <button onclick="editOrder(${order.id})">
                    Edit
                </button>

                <button onclick="deleteOrder(${order.id})">
                    Delete
                </button>
            </td>
        </tr>
        `;
    });
}

// UPDATE
async function editOrder(id) {

    const response = await fetch(API + id + "/");
    const order = await response.json();

    document.getElementById("customer").value = order.customer_name;
    document.getElementById("food").value = order.food_name;
    document.getElementById("quantity").value = order.quantity;
    document.getElementById("price").value = order.price;
    document.getElementById("status").value = order.status;

    editId = id;
}

// DELETE
async function deleteOrder(id) {

    if (confirm("Are you sure you want to delete this order?")) {

        await fetch(API + id + "/", {
            method: "DELETE"
        });

        loadOrders();
    }
}

loadOrders();

</script>

</body>
</html>
